<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    body{
      font-family: Arial;
      background:#f4f6f9;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .box{
      background:white;
      padding:30px;
      width:300px;
      border-radius:12px;
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }
    input{
      width:100%;
      padding:10px;
      margin:10px 0;
      border-radius:8px;
      border:1px solid #ccc;
    }
    button{
      width:100%;
      padding:10px;
      background:#007bff;
      color:white;
      border:none;
      border-radius:8px;
    }
  </style>
</head>

<body>

<div class="box">
  <h3>Admin Login</h3>
  <input type="email" id="email" placeholder="Admin Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDu8l_5KV069EF2brdelpFSeD-RvYUPHYo",
  authDomain: "suijit-1b27f.firebaseapp.com",
  databaseURL: "https://suijit-1b27f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "suijit-1b27f",
  storageBucket: "suijit-1b27f.firebasestorage.app",
  messagingSenderId: "828478604244",
  appId: "1:828478604244:web:132216997caf6640bdcc41",
  measurementId: "G-9EZG144LFH"
};
firebase.initializeApp(firebaseConfig);

function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  firebase.auth().signInWithEmailAndPassword(email,password)
  .then(()=>{
    window.location.href="admin-dashboard.html";
  })
  .catch((error)=>{
    alert(error.message);
  });
}
</script>

</body>
</html>
