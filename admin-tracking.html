<!DOCTYPE html>
<html>
<head>
  <title>Live Driver Tracking - ReadRx</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body { margin:0; font-family:Arial; }
    #map { height:100vh; width: 100%; }
    .topbar {
      position:absolute;
      top:10px;
      left:10px;
      background:white;
      padding:15px;
      border-radius:8px;
      z-index:1000;
      box-shadow:0 3px 10px rgba(0,0,0,0.2);
    }
    .back-btn {
      padding:8px 15px;
      border:none;
      background:#007bff;
      color:white;
      border-radius:5px;
      cursor:pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="topbar">
  <b>🚑 Live Drivers Map</b><br><br>
  <button class="back-btn" onclick="window.location.href='admin-dashboard.html'">⬅ Back</button>
</div>

<div id="map"></div>

<script>
// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDu8l_5KV069EF2brdelpFSeD-RvYUPHYo",
  authDomain: "suijit-1b27f.firebaseapp.com",
  databaseURL: "https://suijit-1b27f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "suijit-1b27f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 1. Map Initialize (Kolkata default center)
const map = L.map('map').setView([22.5726, 88.3639], 12); 
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

// 2. Ambulance PNG Icon Setup
const ambulanceIcon = L.icon({
    iconUrl: 'ambulance.png', // Aapki uploaded file ka naam
    iconSize: [45, 45],       
    iconAnchor: [22, 22],     
    popupAnchor: [0, -20]
});

let markers = {};

// 3. Firebase se Live Location read karein
db.ref("drivers").on("value", (snapshot) => {
  const data = snapshot.val();
  if (data) {
    for (let id in data) {
      const driver = data[id];
      
      // Location check
      if (driver.lat && driver.lng) {
        if (markers[id]) {
          // Purane marker ko move karein
          markers[id].setLatLng([driver.lat, driver.lng]);
        } else {
          // Naya Ambulance Marker map par lagayein
          markers[id] = L.marker([driver.lat, driver.lng], { icon: ambulanceIcon })
            .addTo(map)
            .bindPopup(`<b>${driver.name || 'Driver'}</b><br>Status: ${driver.status || 'Offline'}`);
        }
      }
    }
  }
});

// 4. Login Check (Security)
firebase.auth().onAuthStateChanged(user => {
  if(!user) { 
    window.location.href="index.html"; //
  }
});
</script>

</body>
</html>
