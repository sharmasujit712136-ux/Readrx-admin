<!DOCTYPE html>
<html>
<head>
  <title>Live Driver Tracking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

  <style>
    body { margin:0; font-family:Arial; }
    #map { height:100vh; }
    .topbar{
      position:absolute;
      top:10px;
      left:10px;
      background:white;
      padding:10px;
      border-radius:8px;
      z-index:1000;
      box-shadow:0 3px 10px rgba(0,0,0,0.2);
    }
    button{
      padding:5px 10px;
      border:none;
      background:red;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="topbar">
  <b>🚑 Live Drivers Map (OSM)</b><br><br>
  <button onclick="window.location.href='admin-dashboard.html'">Back</button>
</div>

<div id="map"></div>

<script>

// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDu8l_5KV069EF2brdelpFSeD-RvYUPHYo",
  authDomain: "suijit-1b27f.firebaseapp.com",
  databaseURL: "https://suijit-1b27f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "suijit-1b27f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🔐 Login Check
firebase.auth().onAuthStateChanged(user=>{
  if(!user){
    window.location.href="admin-login.html";
  }
});

// 🗺 Map Init
const map = L.map('map').setView([20.5937, 78.9629], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let markers = {};
let heatLayer;

db.ref("drivers").on("value", snap=>{
  let heatPoints = [];
  const data = snap.val();

  if(data){
    for(let id in data){
      if(data[id].lat && data[id].lng){
        heatPoints.push([
          parseFloat(data[id].lat),
          parseFloat(data[id].lng),
          0.5
        ]);
      }
    }
  }

  if(heatLayer){
    map.removeLayer(heatLayer);
  }

  heatLayer = L.heatLayer(heatPoints, {radius:25});
  heatLayer.addTo(map);
});
db.ref("rideRequests").on("value", snap=>{
  const rides = snap.val();

  if(rides){
    for(let r in rides){
      const ride = rides[r];

      if(ride.status === "active"){
        L.marker([ride.pickupLat, ride.pickupLng])
          .addTo(map)
          .bindPopup("Pickup: " + ride.customerName);
      }
    }
  }
});
const ambulanceIcon = L.icon({
  iconUrl: 'ambulance.png',
  iconSize: [35, 35],
  iconAnchor: [17, 35]
});


// 🔴 Real Time Tracking
db.ref("drivers").on("value", snap=>{
  const data = snap.val();

  // remove old markers
  for(let id in markers){
    map.removeLayer(markers[id]);
  }
  markers = {};

  if(data){
    for(let id in data){
      const driver = data[id];

      if(driver.status === "online" && driver.lat && driver.lng){

        const marker = L.marker([
          parseFloat(driver.lat),
          parseFloat(driver.lng)
        ]).addTo(map)
        marker.on("click", function(){
   window.location.href = "driver-profile.html?id=" + id;
});


        markers[id] = marker;
      }
    }
  }
});

</script>

</body>
</html>
