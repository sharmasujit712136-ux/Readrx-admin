<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body{
      font-family: Arial;
      background:#f4f6f9;
      padding:20px;
    }
    .card{
      background:white;
      padding:20px;
      margin:10px 0;
      border-radius:12px;
      box-shadow:0 3px 10px rgba(0,0,0,0.1);
    }
    button{
      padding:8px 12px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      background:red;
      color:white;
    }
  </style>
</head>

<body>

<h2>🚑 Admin Dashboard</h2>
<button onclick="logout()">Logout</button>

<div class="card" id="stats"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDu8l_5KV069EF2brdelpFSeD-RvYUPHYo", 
  authDomain: "suijit-1b27f.firebaseapp.com",
  databaseURL: "https://suijit-1b27f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "suijit-1b27f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

firebase.auth().onAuthStateChanged(user=>{
  if(!user){
    window.location.href="admin-login.html";
  }
});

function logout(){
  firebase.auth().signOut().then(()=>{
    window.location.href="admin-login.html";
  });
}

db.ref("drivers").on("value", snap=>{
  const data = snap.val();

  let totalDrivers = 0;
  let onlineDrivers = 0;
  let blockedDrivers = 0;
  let totalWallet = 0;

  if(data){
    totalDrivers = Object.keys(data).length;

    for(let id in data){
      if(data[id].status === "online") onlineDrivers++;
      if(data[id].isBlocked === true) blockedDrivers++;
      totalWallet += data[id].wallet?.balance || 0;
    }
  }

  document.getElementById("stats").innerHTML = `
    Total Drivers: ${totalDrivers}<br><br>
    Online Drivers: ${onlineDrivers}<br><br>
    Blocked Drivers: ${blockedDrivers}<br><br>
    Total Wallet Balance: ₹${totalWallet}
  `;
});
<button onclick="window.location.href='admin-drivers.html'">
Manage Drivers
</button>
<button onclick="window.location.href='admin-withdraw.html'">
Withdraw Requests
</button>
<button onclick="window.location.href='admin-referral.html'">
Referral Monitoring
</button>

</script>

</body>
</html>
